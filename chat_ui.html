<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Hospital AI Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+Tamil:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter','Noto Sans Tamil',sans-serif;background:#f0f4f8;min-height:100vh;display:flex;align-items:center;justify-content:center}

/* ── Launcher button ── */
#launcher{
  position:fixed;bottom:24px;right:24px;
  width:58px;height:58px;border-radius:50%;
  background:linear-gradient(135deg,#1a6fb5,#0e9f6e);
  border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 20px rgba(26,111,181,.4);
  transition:transform .2s,box-shadow .2s;
  z-index:999;
}
#launcher:hover{transform:scale(1.08);box-shadow:0 6px 28px rgba(26,111,181,.5)}
#launcher svg{width:26px;height:26px;fill:#fff;transition:transform .3s}
#launcher.open svg{transform:rotate(45deg)}
.launcher-badge{
  position:absolute;top:-2px;right:-2px;
  width:18px;height:18px;border-radius:50%;
  background:#e53e3e;color:#fff;
  font-size:10px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  border:2px solid #fff;
}

/* ── Widget ── */
#widget{
  position:fixed;bottom:92px;right:24px;
  width:370px;height:560px;
  background:#fff;border-radius:18px;
  box-shadow:0 8px 40px rgba(0,0,0,.18);
  display:flex;flex-direction:column;
  overflow:hidden;
  transform:scale(.92) translateY(12px);
  opacity:0;pointer-events:none;
  transition:transform .22s cubic-bezier(.34,1.56,.64,1), opacity .18s ease;
  z-index:998;
}
#widget.open{transform:scale(1) translateY(0);opacity:1;pointer-events:all}

/* Header */
.w-header{
  background:linear-gradient(135deg,#0a2540,#1a6fb5);
  padding:14px 16px;
  display:flex;align-items:center;gap:10px;
  flex-shrink:0;
}
.w-avatar{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.w-info{flex:1;min-width:0}
.w-name{color:#fff;font-size:14px;font-weight:600}
.w-status{color:rgba(255,255,255,.7);font-size:11px;display:flex;align-items:center;gap:4px;margin-top:1px}
.w-dot{width:6px;height:6px;border-radius:50%;background:#0e9f6e;flex-shrink:0}
.w-close{background:rgba(255,255,255,.12);border:none;color:#fff;width:30px;height:30px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;flex-shrink:0}
.w-close:hover{background:rgba(255,255,255,.22)}
.w-close svg{width:14px;height:14px;fill:#fff}

/* Quick chips */
.w-chips{
  padding:10px 12px 0;
  display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;
  scrollbar-width:none;flex-shrink:0;
}
.w-chips::-webkit-scrollbar{display:none}
.w-chip{
  white-space:nowrap;padding:5px 11px;
  background:#f0f4f8;border:1px solid #e2e8f0;
  border-radius:20px;font-size:11.5px;color:#1a6fb5;
  cursor:pointer;transition:all .14s;font-weight:500;
  font-family:inherit;
}
.w-chip:hover{background:#1a6fb5;color:#fff;border-color:#1a6fb5}

/* Chat area */
.w-body{
  flex:1;overflow-y:auto;
  padding:12px;
  display:flex;flex-direction:column;gap:10px;
  scroll-behavior:smooth;
}
.w-body::-webkit-scrollbar{width:4px}
.w-body::-webkit-scrollbar-track{background:transparent}
.w-body::-webkit-scrollbar-thumb{background:#e2e8f0;border-radius:4px}

/* Welcome */
.w-welcome{text-align:center;padding:20px 10px;color:#718096}
.w-welcome-icon{font-size:36px;margin-bottom:8px}
.w-welcome h4{font-size:14px;font-weight:600;color:#2d3748;margin-bottom:4px}
.w-welcome p{font-size:12px;line-height:1.5}

/* Bubbles */
.msg-row{display:flex;gap:7px;animation:fadeUp .18s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg-row.user{flex-direction:row-reverse}
.msg-av{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;margin-top:2px}
.msg-av.ai{background:#e8f4fd}
.msg-av.usr{background:#1a6fb5;color:#fff;font-weight:600;font-size:9px}.bubble{padding:9px 13px;border-radius:14px;font-size:13px;line-height:1.55;max-width:242px;word-break:break-word}
.msg-row.ai .bubble{background:#f7fafc;border:1px solid #e2e8f0;border-bottom-left-radius:4px;color:#2d3748}
.msg-row.user .bubble{background:#1a6fb5;color:#fff;border-bottom-right-radius:4px}
.bubble-time{font-size:10px;color:#a0aec0;margin-top:3px;padding:0 2px}
.msg-row.user .bubble-time{text-align:right}
.intent-tag{display:inline-block;background:#e8f4fd;color:#1a6fb5;padding:1px 6px;border-radius:10px;font-size:9.5px;font-weight:600;margin-left:4px}
.lang-tag{display:inline-block;padding:1px 6px;border-radius:10px;font-size:9.5px;font-weight:600;margin-left:2px}
.lang-tag.ta{background:#fef3c7;color:#92400e}
.lang-tag.en{background:#f0fff4;color:#276749}

/* Typing */
.typing-bubble{display:flex;gap:4px;align-items:center;padding:10px 14px;background:#f7fafc;border:1px solid #e2e8f0;border-radius:14px;border-bottom-left-radius:4px;width:fit-content}
.typing-bubble span{width:5px;height:5px;border-radius:50%;background:#a0aec0;animation:bounce .85s infinite}
.typing-bubble span:nth-child(2){animation-delay:.14s}
.typing-bubble span:nth-child(3){animation-delay:.28s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}

/* System msg */
.sys-msg{text-align:center;font-size:10.5px;color:#a0aec0;padding:2px 0}

/* Input */
.w-footer{border-top:1px solid #e2e8f0;padding:10px 12px;display:flex;gap:8px;align-items:flex-end;flex-shrink:0;background:#fff}
#msg-input{
  flex:1;border:1.5px solid #e2e8f0;border-radius:10px;
  padding:9px 12px;font-size:13px;font-family:inherit;
  resize:none;outline:none;max-height:90px;line-height:1.4;
  transition:border .14s;color:#2d3748;
}
#msg-input:focus{border-color:#1a6fb5}
#msg-input::placeholder{color:#a0aec0}
#send-btn{
  width:36px;height:36px;border-radius:9px;
  background:#1a6fb5;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .14s,transform .1s;flex-shrink:0;
}
#send-btn:hover{background:#155e99}
#send-btn:active{transform:scale(.93)}
#send-btn:disabled{background:#a0aec0;cursor:not-allowed}
#send-btn svg{width:15px;height:15px;fill:#fff}

/* Auth row */
.auth-row{padding:0 12px 8px;display:flex;align-items:center;gap:6px;justify-content:flex-end}
.auth-link{font-size:11px;color:#1a6fb5;cursor:pointer;text-decoration:underline}
.auth-name{font-size:11px;color:#0e9f6e;font-weight:500}

/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:1000;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:16px;padding:24px;width:320px;box-shadow:0 16px 48px rgba(0,0,0,.18)}
.modal h3{font-size:16px;font-weight:600;margin-bottom:2px}
.modal p{color:#718096;font-size:12px;margin-bottom:18px}
.modal-tabs{display:flex;border:1.5px solid #e2e8f0;border-radius:9px;overflow:hidden;margin-bottom:16px}
.modal-tab{flex:1;padding:8px;font-size:12.5px;font-weight:500;cursor:pointer;border:none;background:transparent;color:#718096;font-family:inherit}
.modal-tab.active{background:#1a6fb5;color:#fff}
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;font-weight:600;color:#718096;margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
.field input{width:100%;padding:9px 12px;border:1.5px solid #e2e8f0;border-radius:9px;font-size:13px;font-family:inherit;outline:none;transition:border .14s}
.field input:focus{border-color:#1a6fb5}
.modal-actions{display:flex;gap:8px;margin-top:4px}
.btn-p,.btn-s{flex:1;padding:10px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;border:none;font-family:inherit}
.btn-p{background:#1a6fb5;color:#fff}
.btn-p:hover{background:#155e99}
.btn-s{background:#f7fafc;color:#718096;border:1px solid #e2e8f0}
#modal-err{color:#e53e3e;font-size:11px;margin-top:6px;display:none}

@media(max-width:400px){
  #widget{width:calc(100vw - 16px);right:8px;bottom:80px;height:70vh}
  #launcher{right:16px;bottom:16px}
}
</style>
</head>
<body>

<!-- Launcher -->
<button id="launcher" onclick="toggleWidget()" title="Chat with Hospital AI">
  <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
  <span class="launcher-badge" id="notif-badge" style="display:none">1</span>
</button>

<!-- Widget -->
<div id="widget">

  <!-- Header -->
  <div class="w-header">
    <div class="w-avatar">🏥</div>
    <div class="w-info">
      <div class="w-name">Nithishkumar Hospital</div>
      <div class="w-status"><span class="w-dot"></span>Online · Tamil & English</div>
    </div>
    <button class="w-close" onclick="toggleWidget()" title="Close">
      <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
    </button>
  </div>

  <!-- Quick chips -->
  <div class="w-chips">
    <button class="w-chip" onclick="sendQuick('Visiting hours?')">🕐 Visiting hours</button>
    <button class="w-chip" onclick="sendQuick('Where is the hospital located?')">📍 Location</button>
    <button class="w-chip" onclick="sendQuick('Book appointment')">🗓 Appointment</button>
    <button class="w-chip" onclick="sendQuick('Insurance policy?')">💳 Insurance</button>
  </div>

  <!-- Auth row -->
  <div class="auth-row" id="auth-row"></div>

  <!-- Chat body -->
  <div class="w-body" id="chat-body">
    <div class="w-welcome" id="welcome-el">
      <div class="w-welcome-icon">🏥</div>
      <h4>Hi! How can I help?</h4>
      <p>Ask me about doctors, appointments,<br/>visiting hours, billing — in Tamil or English.</p>
    </div>
  </div>

  <!-- Footer input -->
  <div class="w-footer">
    <textarea id="msg-input" rows="1" placeholder="Type here..."
      onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    <button id="send-btn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<!-- Login Modal -->
<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h3>🏥 Hospital AI</h3>
    <p>Login or create an account</p>
    <div class="modal-tabs">
      <button class="modal-tab active" id="tab-l" onclick="switchTab('login')">Login</button>
      <button class="modal-tab" id="tab-r" onclick="switchTab('register')">Register</button>
    </div>
    <div id="reg-extra" style="display:none">
      <div class="field"><label>Full Name</label><input id="reg-name" type="text" placeholder="Your name"/></div>
    </div>
    <div class="field"><label>Email</label><input id="a-email" type="email" placeholder="you@example.com"/></div>
    <div class="field"><label>Password</label><input id="a-pass" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')submitAuth()"/></div>
    <div id="modal-err"></div>
    <div class="modal-actions">
      <button class="btn-s" onclick="closeModal()">Cancel</button>
      <button class="btn-p" id="auth-btn" onclick="submitAuth()">Login</button>
    </div>
  </div>
</div>

<!-- Demo page backdrop -->
<div style="text-align:center;color:#a0aec0;font-size:13px;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;user-select:none">
  <div style="font-size:48px;margin-bottom:12px">🏥</div>
  <div style="font-weight:600;color:#718096;font-size:15px">Hospital AI Assistant</div>
  <div style="margin-top:6px">Click the chat button →</div>
</div>

<script>
const API = 'http://127.0.0.1:8000';
let token = localStorage.getItem('h_token') || null;
let userEmail = localStorage.getItem('h_email') || null;
let sessionId = 's_' + Math.random().toString(36).slice(2);
let isOpen = false;
let currentTab = 'login';
let msgCount = 0;

window.onload = () => {
  if (token) setAuthUI(true);
  // Show notification badge after 2s if not opened
  setTimeout(() => { if (!isOpen) document.getElementById('notif-badge').style.display = 'flex'; }, 2000);
};

function toggleWidget() {
  isOpen = !isOpen;
  document.getElementById('widget').classList.toggle('open', isOpen);
  document.getElementById('launcher').classList.toggle('open', isOpen);
  document.getElementById('notif-badge').style.display = 'none';
  if (isOpen) setTimeout(() => document.getElementById('msg-input').focus(), 250);
}

// ── Auth ──
function setAuthUI(loggedIn) {
  const row = document.getElementById('auth-row');
  if (loggedIn) {
    row.innerHTML = `<span class="auth-name">✓ ${userEmail}</span> <span class="auth-link" onclick="logout()" style="color:#e53e3e">Logout</span>`;
  } else {
    row.innerHTML = `<span class="auth-link" onclick="openModal()">Login / Register</span>`;
  }
}

function logout() {
  token = null; userEmail = null;
  localStorage.removeItem('h_token'); localStorage.removeItem('h_email');
  setAuthUI(false);
  addSys('Logged out.');
}

function openModal() { document.getElementById('modal-overlay').classList.add('show'); }
function closeModal() { document.getElementById('modal-overlay').classList.remove('show'); clearErr(); }
function clearErr() { const e=document.getElementById('modal-err'); e.style.display='none'; e.textContent=''; }
function showErr(m) { const e=document.getElementById('modal-err'); e.textContent=m; e.style.display='block'; }

function switchTab(t) {
  currentTab = t;
  document.getElementById('tab-l').classList.toggle('active', t==='login');
  document.getElementById('tab-r').classList.toggle('active', t==='register');
  document.getElementById('reg-extra').style.display = t==='register'?'':'none';
  document.getElementById('auth-btn').textContent = t==='login'?'Login':'Register';
  clearErr();
}

async function submitAuth() {
  const email = document.getElementById('a-email').value.trim();
  const pass  = document.getElementById('a-pass').value;
  if (!email||!pass) { showErr('Fill in all fields.'); return; }
  const btn = document.getElementById('auth-btn');
  btn.textContent='...'; btn.disabled=true; clearErr();
  try {
    if (currentTab==='register') {
      const name = document.getElementById('reg-name').value.trim();
      if (!name) { showErr('Enter your name.'); btn.textContent='Register'; btn.disabled=false; return; }
      const r = await fetch(`${API}/auth/register`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({full_name:name,email,password:pass})});
      if (!r.ok) { const d=await r.json(); showErr(d.detail||'Registration failed'); btn.textContent='Register'; btn.disabled=false; return; }
    }
    const r = await fetch(`${API}/auth/login`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pass})});
    const d = await r.json();
    if (!r.ok) { showErr(d.detail||'Login failed'); btn.textContent=currentTab==='login'?'Login':'Register'; btn.disabled=false; return; }
    token=d.access_token; userEmail=email;
    localStorage.setItem('h_token',token); localStorage.setItem('h_email',email);
    setAuthUI(true); closeModal(); addSys('✓ Logged in as '+email);
  } catch(e) { showErr('Cannot connect to server.'); }
  btn.textContent=currentTab==='login'?'Login':'Register'; btn.disabled=false;
}

// ── Chat ──
function handleKey(e) { if (e.key==='Enter'&&!e.shiftKey) { e.preventDefault(); sendMessage(); } }
function autoResize(el) { el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,90)+'px'; }
function sendQuick(t) { document.getElementById('msg-input').value=t; sendMessage(); }

async function sendMessage() {
  const input = document.getElementById('msg-input');
  const text  = input.value.trim();
  if (!text) return;

  const welcome = document.getElementById('welcome-el');
  if (welcome) welcome.remove();

  addBubble('user', text);
  input.value=''; input.style.height='auto';
  document.getElementById('send-btn').disabled=true;
  const tid = addTyping();

  try {
    const headers = {'Content-Type':'application/json'};
    if (token) headers['Authorization']='Bearer '+token;
    const r = await fetch(`${API}/chat/`,{method:'POST',headers,body:JSON.stringify({session_id:sessionId,message:text})});
    removeTyping(tid);
    if (r.status===401||r.status===403) {
      addBubble('ai','🔒 Please login to use the assistant.',{});
      openModal();
    } else if (!r.ok) {
      const d=await r.json();
      addBubble('ai','⚠️ '+(d.detail||'Error. Try again.'),{});
    } else {
      const d=await r.json();
      addBubble('ai',d.reply,{intent:d.detected_intent,lang:d.detected_language});
    }
  } catch(e) {
    removeTyping(tid);
    addBubble('ai','⚠️ Server not reachable. Is uvicorn running?',{});
  }
  document.getElementById('send-btn').disabled=false;
  document.getElementById('msg-input').focus();
}

function addBubble(role, text, meta) {
  const body = document.getElementById('chat-body');
  const row  = document.createElement('div');
  row.className='msg-row '+role;

  const av=document.createElement('div');
  av.className='msg-av '+(role==='ai'?'ai':'usr');
  av.textContent=role==='ai'?'🏥':(userEmail?userEmail[0].toUpperCase():'You');

  const wrap=document.createElement('div');
  const b=document.createElement('div');
  b.className='bubble'; b.textContent=text; wrap.appendChild(b);

  if (meta && (meta.intent||meta.lang)) {
    const t=document.createElement('div');
    t.className='bubble-time';
    const now=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    t.textContent=now;
    if (false) 
{
      const tag=document.createElement('span');
      tag.className='intent-tag'; tag.textContent=meta.intent.replace(/_/g,' '); t.appendChild(tag);
    }
    if (meta.lang) {
      const ltag=document.createElement('span');
      ltag.className='lang-tag '+meta.lang;
      ltag.textContent=meta.lang==='ta'?'🇮🇳 Tamil':'🇬🇧 EN';
      t.appendChild(ltag);
    }
    wrap.appendChild(t);
  }

  row.appendChild(av); row.appendChild(wrap);
  body.appendChild(row);
  body.scrollTop=body.scrollHeight;
}

function addSys(text) {
  const body=document.getElementById('chat-body');
  const d=document.createElement('div'); d.className='sys-msg'; d.textContent=text;
  body.appendChild(d); body.scrollTop=body.scrollHeight;
}

function addTyping() {
  const body=document.getElementById('chat-body');
  const row=document.createElement('div'); row.className='msg-row ai';
  const id='t_'+Date.now(); row.id=id;
  const av=document.createElement('div'); av.className='msg-av ai'; av.textContent='🏥';
  const b=document.createElement('div'); b.className='typing-bubble';
  b.innerHTML='<span></span><span></span><span></span>';
  row.appendChild(av); row.appendChild(b);
  body.appendChild(row); body.scrollTop=body.scrollHeight;
  return id;
}
function removeTyping(id) { const e=document.getElementById(id); if(e)e.remove(); }
</script>
</body>
</html>
